packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@fontsource-variable/geist": ^5.2.8
  "@graphql-hive/gateway-runtime": ^2.7.7
  "@graphql-mesh/transport-rest": ^0.9.28
  "@tailwindcss/vite": ^4.2.1
  "@types/node": ^24
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^0.577.0
  radix-ui: ^1.4.3
  shadcn: ^4.0.8
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.2.1
  tw-animate-css: ^1.4.0
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
